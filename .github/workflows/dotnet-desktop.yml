name: .NET Core Desktop

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        runtime: [win-x64, win-x86]

    runs-on: windows-latest  # For a list of available runner types, refer to

    env:
      Project_Name: FreeMove
      Target: net10.0-windows

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET workload
    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # Execute all unit tests in the solution
    # - name: Execute unit tests
    #   run: dotnet test
      
    # Build the solution
    - name: Build the solution
      run: dotnet publish -c Release -r ${{ matrix.runtime }}

    # Upload the app executable: https://github.com/marketplace/actions/upload-a-build-artifact
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.Project_Name }}_${{ matrix.runtime }}.exe
        path: ${{ env.Project_Name }}\bin\Release\${{ env.Target }}\${{ matrix.runtime }}\publish\${{ env.Project_Name }}.exe
